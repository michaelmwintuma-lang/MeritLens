# Runs on every push and pull request: the backend tests, the frontend build, and the browser checks (a throwaway
# copy of the app in headless Chrome). Each job installs exactly what README: Installation describes.
name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Tests (including the isolation test and the static check)
        working-directory: backend
        run: python -m pytest -q

  # The same tests on PostgreSQL 16 (an empty database each run), the database for a real deployment
  # (deploy/postgres/README.md). Tests of SQLite-only behaviour (copying the database file) are skipped there.
  backend-tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meritlens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-postgres.txt
      - run: pip install -r backend/requirements-postgres.txt
      - name: Tests on PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/meritlens_test
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build  # type-checks the TypeScript API layer, then builds
        working-directory: frontend

  # The deployment's two images build (deploy/README.md); nothing is pushed anywhere
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and website images
        run: |
          docker build -f deploy/backend.Dockerfile -t meritlens-api .
          docker build -f deploy/web.Dockerfile -t meritlens-web .
      - name: The API image starts and answers
        run: |
          docker run -d --name api -e DEMO_PASSWORD=ci-only-password -p 8000:8000 meritlens-api
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  browser-checks:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Browser checks on a throwaway copy of the app
        env:
          CHROME_PATH: google-chrome
        run: python scripts/browser_test.py

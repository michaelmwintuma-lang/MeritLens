# Database migrations (Alembic). The app applies them by itself at start-up (app/core/migrations.py); this file is
# for making a new one, from the backend folder:
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "what changed"
# The database address comes from the app's settings (DATABASE_URL), not from here.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
